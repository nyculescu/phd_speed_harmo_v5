# ========================================================================
# DRL-VSL Network & Detector Configuration (Merge 4 -> 3)
# This file mirrors `network_config_3_2.yaml` but increases the corridor by
# one lane everywhere, yielding a 4-to-3 lane drop at the bottleneck.
# ========================================================================

network_properties:
  # Base properties for the entire network
  lane_width: 3.2
  # Length of the merge junction (visual gap) in meters
  merge_junction_length: 100.0
  # Keep leftmost lanes aligned across the 4->3 drop.
  alignment_reference_lanes: 3
  lane_drop_side: right
  # This section may be auto-populated by the network generator script
  junction_coordinates:
    J0: {x: -10000.0, y: 60.0}
    J1: {x: -9750.0, y: 60.0}
    J2: {x: -9500.0, y: 60.0}
    J3: {x: -9000.0, y: 60.0}
    J4: {x: -8500.0, y: 60.0}
    J5: {x: -8000.0, y: 60.0}
    J6: {x: -7500.0, y: 60.0}
    J7: {x: -7250.0, y: 60.0}

detector_properties:
  frequency: 150 # TODO: Set frequency to match the environment's aggregation_time
  output_file: "/dev/null" # In Linux, this points detector output to the null sink. Otherwise, use  "loops_detector_metrics.xml"

  # Default strategy for placing detectors on a segment.
  # Can be overridden in the segment definitions below.
  default_strategy:
    # 'entry_exit': Places one loop at the start and one at the end.
    # 'exit_only': Places one loop at the very end. Best for measuring flow.
    # 'midpoint': Places one loop at the segment midpoint.
    # 'entry_mid_exit': Places loops at start, midpoint, and end.
    flow_loop_placement: 'entry_mid_exit'

  # Travel time detectors (E3) for critical segments (entry @ 0m, exit @ 1000m).
  # Used for space-mean speed, travel time, and derived density.
  travel_time_detectors:
    - id: "e3_seg_2_before"
      entry_segment: "seg_2_before"
      entry_pos: 0.0
      exit_segment: "seg_2_before"
      exit_pos: 1000.0
      frequency: 150
    - id: "e3_seg_1_before"
      entry_segment: "seg_1_before"
      entry_pos: 0.0
      exit_segment: "seg_1_before"
      exit_pos: 1000.0
      frequency: 150
    - id: "e3_seg_0_before"
      entry_segment: "seg_0_before"
      entry_pos: 0.0
      exit_segment: "seg_0_before"
      exit_pos: 1000.0
      frequency: 150
    # Legacy corridor detector (kept for v12 compatibility)
    - id: "e3_corridor"
      entry_segment: "seg_2_before"
      entry_pos: 0.0
      exit_segment: "seg_0_after"
      exit_pos: 1000.0
      frequency: 150

  # VSL sign POIs to show in GUI (kept in loops_detectors.add.xml)
  vsl_pois:
    - seg_2_before
    - seg_1_before
    - seg_0_before

segments:
  # --- Upstream Segments (4 Lanes) ---
  # Explicitly disable unused detectors for simulation efficiency.
  seg_4_before:  { id_prefix: "us4", length: 1000.0, lanes: 4, visual_multiplier: 0.25, generate_detectors: false }
  seg_3_before:  { id_prefix: "us3", length: 1000.0, lanes: 4, visual_multiplier: 0.25, generate_detectors: false }

  # Explicitly enable detectors for segments monitored by the agent.
  seg_2_before:  { id_prefix: "us2", length: 1000.0, lanes: 4, visual_multiplier: 0.5, generate_detectors: true }
  seg_1_before:  { id_prefix: "us1", length: 1000.0, lanes: 4, visual_multiplier: 0.5, generate_detectors: true }
  seg_0_before:
    id_prefix: "us0"
    length: 1000.0
    lanes: 4
    visual_multiplier: 0.5
    generate_detectors: true

  # --- Downstream Segments (3 Lanes) ---
  seg_0_after:
    id_prefix: "ds0"
    length: 1000.0
    lanes: 3
    visual_multiplier: 0.5
    generate_detectors: true
  seg_1_after:   { id_prefix: "ds1", length: 1000.0, lanes: 3, visual_multiplier: 0.25, generate_detectors: false }
