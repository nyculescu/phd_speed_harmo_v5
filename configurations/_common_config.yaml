# =============================================================================
# Project-level common configuration — phd_speed_harmo_v5
# All experiments inherit from this file.
# Topology: ramp_on_v0 (3-lane mainline + on-ramp, no off-ramp)
# =============================================================================

sumo:
  aggregation_time: 30          # must match freq in detectors_ramps_v0.add.xml
  step_length: 1.0
  episode_duration_s: 7950      # 265 × 30 s windows
  warmup_s: 300
  custom_config:
    speed_limit_direct_control_CAV: true
    regime_gate_enabled: false  # regime encoded as one-hot in state features

scenario_generation:
  network_topology: ramps_v0
  cavs_percentage: 50.0

# SAR framework: to be defined after Step 1 (no-control baseline) analysis.
# sar:
#   algorithm: TQC_v0
#   state: ramp_on_state_v0
#   action: ramp_on_action_v0
#   reward: ramp_on_reward_v0

logging:
  log_dir: ./logs/ramp_on_v0
  tensorboard_dump_csv: false
  enable_file_output: false
  csv_logging: false
  tensorboard_dump_evaluations: true
