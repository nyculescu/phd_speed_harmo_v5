# =============================================================================
# m43_v0 / s0 — DQN (comparison baseline)
# =============================================================================
meta:
  base_configs:
    - _common_agents.yaml
  version: m43_v0_dqn

execution:
  train_and_eval_sequential:
    enabled: false

sar:
  algorithm: DQN_v0
  parameters:
    learning_rate: 6.0e-05
    tau: 0.015
    exploration_fraction: 0.35
    exploration_initial_eps: 1.0
    exploration_final_eps: 0.08
    replay_buffer_kwargs:
      alpha: 0.6
      beta_start: 0.4
      beta_frames: 1000000
      temporal_priority_boost: 1.1
