# =============================================================================
# m43_v0 / s0 — QR-DQN (primary algorithm)
# =============================================================================
meta:
  base_configs:
    - _common_agents.yaml
  version: m43_v0_qrdqn

execution:
  train_and_eval_sequential:
    enabled: false

sar:
  algorithm: QRDQN_v0
  parameters:
    learning_rate: 5.5e-05
    tau: 0.01
    exploration_fraction: 0.35
    exploration_initial_eps: 1.0
    exploration_final_eps: 0.08
    policy_kwargs:
      n_quantiles: 25
      net_arch: [256, 256]
  anti_collapse:
    min_exploration_final_eps: 0.05
    min_exploration_fraction: 0.20
  risk:
    enabled: false
    mode: cvar
    alpha: 0.10
    runtime_override_env: RISK_MODE
